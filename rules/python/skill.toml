name = "python"
title = "Python Rules"
description = "Use for Python 3.15+ implementation, review, and project setup: ruff and ty enforcement, uv projects and dependencies, library choices, modern language features, typing, code quality and module organization, circular imports, API design, defensive programming, data modeling, error handling, resource lifecycle, async and concurrency, text encoding and files, performance, testing, documentation, and Python pitfalls."
paths = "**/*.py,**/*.pyi,**/pyproject.toml,**/uv.lock,**/ruff.toml,**/.ruff.toml,**/ty.toml,**/.python-version"

[[rules]]
title = "Lints, formatting, and type checking"
file = "python-lints-and-type-checking.md"
when = "Read when bootstrapping a Python project or configuring ruff, ty, suppressions, test allowances, and shared local/CI tasks; install the complete required baseline."

[[rules]]
title = "Projects and dependencies"
file = "python-projects-and-dependencies.md"
when = "Read when creating a uv project or script, adding, pinning, auditing, or upgrading dependencies, declaring the supported Python version, or structuring a uv workspace."

[[rules]]
title = "Ecosystem"
file = "python-ecosystem.md"
when = "Read when choosing or adding a library for HTTP, CLIs, validation, settings, web APIs, databases, logging, terminal output, retries, dates, serialization, dataframes, documentation sites, or git hooks."

[[rules]]
title = "Modern language features"
file = "python-modern-language.md"
when = "Read when choosing between newer and older Python constructs: match statements, PEP 695 generics, lazy imports, template strings, sentinels, frozendict, comprehension unpacking, and exception groups."

[[rules]]
title = "Typing"
file = "python-typing.md"
when = "Read when annotating functions and classes, choosing between Protocol, ABC, TypedDict, Literal, enums, and NewType, narrowing types, or deciding whether Any, cast, or overload is justified."

[[rules]]
title = "Code quality and module organization"
file = "python-code-quality.md"
when = "Read when organizing modules and packages, placing business logic and state, preventing circular imports, choosing names, or deciding between functions, classes, and modules."

[[rules]]
title = "API design"
file = "python-api-design.md"
when = "Read when designing function signatures, constructors, public package surfaces, decorators, extension points, or deprecations."

[[rules]]
title = "Defensive programming"
file = "python-defensive-programming.md"
when = "Read when validating input, enforcing invariants, choosing assertions versus exceptions, handling numbers and money, or exposing untrusted data to parsers, subprocesses, and deserializers."

[[rules]]
title = "Data modeling"
file = "python-data-modeling.md"
when = "Read when defining records, value objects, domain states, or wire models, or choosing between dataclasses, pydantic models, TypedDict, and plain dicts."

[[rules]]
title = "Error handling"
file = "python-error-handling.md"
when = "Read when designing exception hierarchies, raising, wrapping, catching, logging, or reporting errors, or handling exception groups."

[[rules]]
title = "Resources and lifecycle"
file = "python-resources-and-lifecycle.md"
when = "Read when acquiring files, connections, clients, locks, temporary state, or subprocesses, or writing context managers, generators that own resources, and shutdown paths."

[[rules]]
title = "Async and concurrency"
file = "python-async-and-concurrency.md"
when = "Read when writing asyncio code, spawning tasks, handling cancellation, timeouts, retries, and shutdown, bounding concurrent work, using threads or processes, or targeting free-threaded Python."

[[rules]]
title = "Text encoding and files"
file = "python-text-and-files.md"
when = "Read when reading or writing files, choosing text encodings, converting between bytes and str, handling paths, writing files atomically, or exchanging text with subprocesses."

[[rules]]
title = "Performance"
file = "python-performance.md"
when = "Read when optimizing Python code, profiling, choosing data structures, caching, reducing startup time, or moving CPU-bound work to processes, interpreters, or free-threaded builds."

[[rules]]
title = "Testing"
file = "python-testing.md"
when = "Read when adding, refactoring, or reviewing pytest tests, fixtures, parametrization, property tests, snapshots, fakes and mocks, time control, async tests, or type assertions."

[[rules]]
title = "Documentation"
file = "python-documentation.md"
when = "Read when writing or reviewing docstrings, module docs, README examples, or documentation sites."

[[rules]]
title = "Pitfalls"
file = "python-pitfalls.md"
when = "Read when writing or reviewing Python for behavior that linters miss: aliasing, iteration, truthiness, equality and hashing, closures, caching, time, import-time behavior, and habits carried over from other languages."
