name = "solidjs"
title = "SolidJS Rules"
description = "Use for SolidJS implementation, review, and architecture decisions: reactivity, components and props, component file conventions, control flow, stores and state, state architecture and business logic separation, ecosystem and library choices, data fetching, forms, i18n and locale handling, lifecycle and refs, testing, TypeScript, and React-to-Solid migration."
paths = "**/*.tsx,**/*.jsx,**/*.ts,**/*.js"

[[rules]]
title = "Reactivity"
file = "solidjs-reactivity.md"
when = "Read when creating or reviewing signals, memos, effects, derived state, batch/untrack, or reactive ownership."

[[rules]]
title = "Components and props"
file = "solidjs-components-and-props.md"
when = "Read when writing or reviewing components, props handling, defaults, prop forwarding, or children."

[[rules]]
title = "Component conventions"
file = "solidjs-component-conventions.md"
when = "Read when creating or organizing component files: exports per file, component declaration style, and props type naming."

[[rules]]
title = "Control flow"
file = "solidjs-control-flow.md"
when = "Read when rendering conditionals or lists in JSX, or choosing between Show, For, Index, Switch, Dynamic, and Portal."

[[rules]]
title = "Stores and state"
file = "solidjs-stores-and-state.md"
when = "Read when managing nested or shared state with createStore, produce, reconcile, context, or global state."

[[rules]]
title = "State architecture"
file = "solidjs-state-architecture.md"
when = "Read when deciding where state and business logic live: state modules, actions and selectors, or component-local UI state."

[[rules]]
title = "Ecosystem"
file = "solidjs-ecosystem.md"
when = "Read when choosing or adding libraries, targeting Solid versions, or setting up routing, SSR, headless UI, tables, virtualization, timing utilities, hotkeys, i18n, or devtools."

[[rules]]
title = "Data fetching"
file = "solidjs-data-fetching.md"
when = "Read when fetching or mutating server state with TanStack Query, wiring Suspense and ErrorBoundary, integrating router loaders, or using createResource."

[[rules]]
title = "Forms"
file = "solidjs-forms.md"
when = "Read when building or reviewing forms, validation schemas, or form submission flows."

[[rules]]
title = "Internationalization"
file = "solidjs-i18n.md"
when = "Read when adding or reviewing i18n: Paraglide JS strategy arrays and locale detection, locale switching, middleware and request context, custom strategies, or @solid-primitives/i18n dictionaries and translators."

[[rules]]
title = "Lifecycle and refs"
file = "solidjs-lifecycle-and-refs.md"
when = "Read when using onMount, onCleanup, element refs, or integrating imperative and third-party code."

[[rules]]
title = "Testing"
file = "solidjs-testing.md"
when = "Read when adding or reviewing tests for SolidJS components, primitives, or reactive behavior."

[[rules]]
title = "TypeScript"
file = "solidjs-typescript.md"
when = "Read when typing components, props, signals, events, or refs, or configuring TypeScript for Solid."

[[rules]]
title = "React to Solid migration"
file = "solidjs-react-migration.md"
when = "Read when porting React code or React habits to SolidJS, or reviewing Solid code written by React developers."
